{"name":"Build Dhenlux APK v6c","jobs":{"build":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"uses":"actions/setup-node@v4","with":{"node-version":20}},{"uses":"actions/setup-java@v4","with":{"distribution":"temurin","java-version":17}},{"name":"Find and unpack the build 6 zip (any file name)","run":"found=0\nfor z in *.zip; do\n  rm -rf /tmp/z && mkdir /tmp/z\n  unzip -q -o \"$z\" -d /tmp/z || continue\n  if grep -q \"Dhenlux app build 6\" /tmp/z/www/index.html 2>/dev/null; then\n    cp -r /tmp/z/. .\n    echo \"Using $z\"\n    found=1\n    break\n  fi\ndone\ntest \"$found\" = 1\n"},{"run":"grep -c \"dhenlux_ring3\" resources/native/AlarmReceiver.java"},{"run":"npm install"},{"run":"npx cap add android"},{"run":"node scripts/patch-android.mjs"},{"run":"npx cap sync android"},{"name":"Build debug APK","working-directory":"android","run":"./gradlew assembleDebug"},{"uses":"actions/upload-artifact@v4","with":{"name":"dhenlux-v6-apk","path":"android/app/build/outputs/apk/debug/app-debug.apk"}}]}},"on":{"workflow_dispatch":{}}}

name: Build Dhenlux APK v7
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip the project
        run: |
          mkdir -p work
          unzip -q dhenlux-v7.zip -d work
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install and add Android
        working-directory: work
        run: |
          npm install
          npx cap add android
      - name: Patch Android project
        working-directory: work
        run: |
          node scripts/patch-android.mjs
          npx cap sync android
      - name: Build debug APK
        working-directory: work/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: dhenlux-v7-apk
          path: work/android/app/build/outputs/apk/debug/app-debug.apk

 name: Build Dhenlux APK v7
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip the project
        run: |
          mkdir -p work
          unzip -q dhenlux-v7.zip -d work
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS_IN: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS_IN: ${{ secrets.KEY_ALIAS }}
          KS_KEYPASS_IN: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/dhenlux.jks"
            echo "KS_PATH=$RUNNER_TEMP/dhenlux.jks" >> "$GITHUB_ENV"
            echo "KS_PASS=$KS_PASS_IN" >> "$GITHUB_ENV"
            echo "KS_ALIAS=$KS_ALIAS_IN" >> "$GITHUB_ENV"
            echo "KS_KEYPASS=$KS_KEYPASS_IN" >> "$GITHUB_ENV"
            echo "Using the fixed Dhenlux signing key"
          else
            echo "No signing key set. This build gets a temporary key."
          fi
      - name: Install and add Android
        working-directory: work
        run: |
          npm install
          npx cap add android
      - name: Patch Android project
        working-directory: work
        run: |
          node scripts/patch-android.mjs
          npx cap sync android
      - name: Build debug APK
        working-directory: work/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: dhenlux-v7-apk
          path: work/android/app/build/outputs/apk/debug/app-debug.apk

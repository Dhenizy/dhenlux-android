name: Build Dhenlux APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: unzip -o dhenlux-android-project.zip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - run: node scripts/patch-android.mjs
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: dhenlux-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish download link
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk dhenlux.apk
          gh release delete latest --cleanup-tag --yes --repo ${{ github.repository }} || true
          gh release create latest dhenlux.apk --title "Dhenlux latest" --notes "Latest Android build" --latest --repo ${{ github.repository }}
